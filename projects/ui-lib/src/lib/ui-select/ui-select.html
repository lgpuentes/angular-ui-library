<div class="select-container">
<label>{{ label() }}</label>

@if (loading()) {
  <p>Cargando opciones...</p>
} @else {
    <select
        [disabled]="disabled()"
        [value]="value() ?? ''"
        (change)="onSelectionChange($event)"
        >
        <option value="" disabled>
            {{ placeholder() }}
        </option>

        @for (option of options(); track option.value) {
            <option [value]="option.value">
                {{ option.label }}
            </option>
        }
    </select>
    }
</div>
