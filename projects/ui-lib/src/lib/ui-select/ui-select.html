<div class="select-container">
<label>{{ label() }}</label>

@if (loading()) {
  <p>Cargando opciones...</p>
} @else {
    <select
        class="w-full px-3 py-[10px] border border-gray-300 rounded-md bg-white text-sm text-gray-900 cursor-pointer focus:outline focus:outline-2 focus:outline-blue-600 focus:outline-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="disabled()"
        [value]="value() ?? ''"
        (change)="onSelectionChange($event)"
        >
        <option value="" disabled>
            {{ placeholder() }}
        </option>

        @for (option of options(); track option.value) {
            <option [value]="option.value">
                {{ option.label }}
            </option>
        }
    </select>
    }
</div>
