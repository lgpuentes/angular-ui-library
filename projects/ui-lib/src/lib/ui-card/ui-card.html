<div class="block bg-white rounded-lg overflow-hidden transition-shadow duration-200">
    <div
        [ngClass]="elevationClasses[elevation()]"
        class="p-4 cursor-pointer"
        (click)="headerClicked.emit()">
        <h2 class="m-0 text-lg font-semibold">{{ title() }}</h2>
    </div>

    @if (subtitle()) {
        <p class="mt-2 mx-0 px-5 text-gray-500">{{ subtitle() }}</p>
    }

    <div class="p-5">
        <ng-content></ng-content>
    </div>
</div>
