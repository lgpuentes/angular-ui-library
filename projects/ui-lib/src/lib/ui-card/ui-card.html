<div class="card">
    <div
        class="card-header" 
        [ngClass]="elevation()"
        (click)="headerClicked.emit()">
        <h2>{{ title() }}</h2>

    </div>
    @if (subtitle()) {
        <p>{{ subtitle() }}</p>
    }
    <div
        class="card-content">
        <ng-content>

        </ng-content>
    </div>
</div>
